spring.application.name=Material-Construcao

# 1. Conexão Dinâmica (Local vs Railway) com Suporte a Acentos e Fuso Horário
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:material}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Gur1j0$e2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Hibernate / JPA (Atualizado para o dialeto moderno)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Gerenciamento pelo Flyway (Correção da propriedade baseline)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 4. Porta Dinâmica para Nuvem (Obrigatório para o Railway)
server.port=${PORT:8080}
server.address=0.0.0.0

# 5. JWT Fixo em Produção (Dica: Mova o secret real para as variáveis do Railway por segurança!)
jwt.secret=${JWT_SECRET:9a4f2c8d3e7b1a5f6c8d9e0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c}
jwt.expiration=86400000

# 6. Logs do Spring Security
logging.level.org.springframework.security=INFO

